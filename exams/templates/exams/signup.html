{% extends "exams/base.html" %}
{% block title %}Sign Up — Exam Locator{% endblock %}
{% block content %}
  <h1 class="page-title">Create an account</h1>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Sign up</button>
    </form>
  </div>
  <p class="helper-link">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
