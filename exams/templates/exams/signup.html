{% extends "exams/base.html" %}
{% block title %}Sign Up — Exam Locator{% endblock %}
{% block content %}
  <div class="eyebrow">Get started</div>
  <h1 class="page-title">Create your account</h1>
  <p class="page-sub">Track your exams and see venue maps in one place.</p>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Sign up</button>
    </form>
  </div>
  <p class="helper-link">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
