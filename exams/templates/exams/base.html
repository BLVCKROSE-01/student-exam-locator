<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Student Exam Locator{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1B2A4A;
      --navy-light: #2A3D63;
      --amber: #E8A33D;
      --amber-dark: #C4842A;
      --paper: #F7F5F0;
      --paper-dim: #EFEBE2;
      --ink: #22262E;
      --slate: #6B7280;
      --line: #D8D3C6;
      --success: #3A7D5C;
      --radius: 3px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.5;
    }
    h1, h2, h3 {
      font-family: 'Archivo Narrow', sans-serif;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--navy);
      margin: 0;
    }
    a { color: var(--navy); }

    .board-header {
      background: var(--navy);
      color: var(--paper);
      padding: 0;
      border-bottom: 4px solid var(--amber);
    }
    .board-header-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .board-brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .board-brand .mark {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 13px;
      background: var(--amber);
      color: var(--navy);
      padding: 3px 7px;
      border-radius: var(--radius);
      letter-spacing: 0.03em;
    }
    .board-brand .name {
      font-family: 'Archivo Narrow', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: var(--paper);
      letter-spacing: 0.01em;
    }
    .board-nav {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
    }
    .board-nav a {
      color: var(--paper);
      text-decoration: none;
      opacity: 0.82;
      border-bottom: 2px solid transparent;
      padding-bottom: 3px;
      transition: opacity 0.15s, border-color 0.15s;
    }
    .board-nav a:hover { opacity: 1; border-color: var(--amber); }
    .board-nav .user-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      opacity: 0.65;
    }

    .shell {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--amber-dark);
      margin-bottom: 10px;
    }
    .page-title {
      font-size: 34px;
      margin-bottom: 8px;
    }
    .page-sub {
      color: var(--slate);
      font-size: 15px;
      margin-bottom: 32px;
      max-width: 520px;
    }

    .search-panel {
      background: var(--navy);
      border-radius: 6px;
      padding: 22px;
      display: flex;
      gap: 10px;
      box-shadow: 0 8px 24px -12px rgba(27,42,74,0.4);
      margin-bottom: 36px;
    }
    .search-panel input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.18);
      color: var(--paper);
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      letter-spacing: 0.02em;
      padding: 12px 14px;
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .search-panel input[type="text"]::placeholder { color: rgba(247,245,240,0.45); }
    .search-panel input[type="text"]:focus {
      border-color: var(--amber);
      background: rgba(255,255,255,0.12);
    }
    .btn {
      font-family: 'Archivo Narrow', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: var(--amber);
      color: var(--navy);
      border: none;
      padding: 12px 22px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s, transform 0.08s;
    }
    .btn:hover { background: #F0B354; }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--navy);
      color: var(--navy);
    }
    .btn-outline:hover { background: var(--navy); color: var(--paper); }

    .board {
      border: 1.5px solid var(--navy);
      border-radius: 6px;
      overflow: hidden;
      background: white;
    }
    .board-row {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr 1fr 1.3fr;
      gap: 0;
      border-bottom: 1px solid var(--line);
      animation: reveal 0.35s ease backwards;
    }
    .board-row:last-child { border-bottom: none; }
    .board-row.head {
      background: var(--paper-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--slate);
      animation: none;
    }
    .board-row > div {
      padding: 16px 16px;
      font-size: 14px;
      display: flex;
      align-items: center;
    }
    .board-row .cell-course { font-weight: 600; color: var(--navy); }
    .board-row .cell-course .course-name {
      display: block;
      font-size: 12px;
      color: var(--slate);
      font-weight: 400;
      margin-top: 3px;
      line-height: 1.3;
    }
    .board-row .cell-time { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .board-row .cell-venue {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--ink);
    }
    .board-row .cell-venue .tag {
      background: var(--paper-dim);
      color: var(--navy);
      padding: 2px 7px;
      border-radius: var(--radius);
      font-size: 11px;
      margin-left: 6px;
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .board-row { animation: none; }
    }

    .empty-state {
      border: 1.5px dashed var(--line);
      border-radius: 6px;
      padding: 28px 24px;
      color: var(--slate);
      font-size: 14px;
    }

    .helper-link {
      margin-top: 24px;
      font-size: 14px;
      color: var(--slate);
    }
    .helper-link a { font-weight: 600; text-decoration: none; }
    .helper-link a:hover { text-decoration: underline; }

    .form-card {
      background: white;
      border: 1.5px solid var(--navy);
      border-radius: 6px;
      padding: 32px;
      max-width: 420px;
      box-shadow: 0 8px 24px -12px rgba(27,42,74,0.15);
    }
    .form-card p { margin: 0 0 16px; }
    .form-card label { display: none; }
    .form-card input,
    .form-card ul {
      width: 100%;
    }
    .form-card input {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      outline: none;
      transition: border-color 0.15s;
      margin-top: 4px;
    }
    .form-card input:focus { border-color: var(--navy); }
    .form-card p > *:not(input):not(label) {
      font-size: 12px;
      color: var(--slate);
      display: block;
      margin-top: 6px;
      line-height: 1.4;
    }
    .form-card ul {
      list-style: none;
      padding: 0;
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--slate);
    }
    .form-card .errorlist {
      color: #B3261E;
      font-size: 13px;
      font-weight: 500;
      list-style: none;
      padding: 0;
      margin: -6px 0 10px;
    }
    .form-card button { width: 100%; margin-top: 6px; }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--slate);
      padding: 40px 24px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.02em;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.form-card input').forEach(function (input) {
        var label = document.querySelector('label[for="' + input.id + '"]');
        if (label && !input.placeholder) {
          input.placeholder = label.textContent.replace(':', '').trim();
        }
      });
    });
  </script>
</head>
<body>
  <div class="board-header">
    <div class="board-header-inner">
      <div class="board-brand">
        <span class="mark">GATE</span>
        <span class="name">Exam Locator</span>
      </div>
      <nav class="board-nav">
        <a href="{% url 'search' %}">Search</a>
        {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}">My Exams</a>
          <span class="user-chip">{{ user.username }}</span>
        {% else %}
          <a href="{% url 'login' %}">Log in</a>
          <a href="{% url 'signup' %}">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </div>
  <div class="shell">
    {% block content %}{% endblock %}
  </div>
  <footer>CSBC 252 &middot; Student Exam Locator &middot; Deployed on AWS</footer>
</body>
</html>
