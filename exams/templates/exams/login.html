{% extends "exams/base.html" %}
{% block title %}Log In — Exam Locator{% endblock %}
{% block content %}
  <h1 class="page-title">Log in</h1>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Log in</button>
    </form>
  </div>
  <p class="helper-link">No account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
